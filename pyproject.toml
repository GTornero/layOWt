[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "layowt"
description = "Multi-disciplinary Offshore Wind Farm Layout Optimisation in Python."
authors = [{ name = "Guillermo Tornero", email = "gtornerodediego@gmail.com" }]
requires-python = ">=3.10"
version = "0.6.0"
readme = "README.md"
dependencies = [
    "matplotlib==3.6.2",
    "numpy==1.23.5",
    "scipy==1.9.3",
    "Shapely==1.8.1.post1",
    "geopandas==0.10.2",
    "SQLAlchemy==1.4.36",
    "GeoAlchemy2==0.13.1",
    "pandas==1.5.1",
    "pyproj==3.3.1",
    "pytest==7.1.2",
    "psycopg2==2.9.3",
    "pyodbc==4.0.34",
    "h5py==3.7.0",
    "contextily==1.3.0",
    "coastlib==1.0.0",
]

[project.optional-dependencies]
doc = [
    "sphinx~=5.0.1",
    "astroid<3",
    "myst-parser",
    "furo",
    "nbsphinx",
    "sphinx-autoapi",
    "sphinx-hoverxref",
    "sphinx-copybutton",
]
tests = ["pytest==7.1.2"]
